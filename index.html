<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>量化交易終端機 v15.1 - 手機自適應版</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #050b14; color: #c9d1d9; padding: 10px; margin: 0; font-size: 0.95em; }
        
        /* 登入遮罩 */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #0d1117; padding: 30px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 0 50px rgba(88,166,255,0.2); text-align: center; width: 85%; max-width: 320px; box-sizing: border-box; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #30363d; background: #010409; color: #58a6ff; font-size: 1.2em; text-align: center; letter-spacing: 3px; box-sizing: border-box; }
        .btn-action { background: #238636; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-action:hover { background: #2ea043; }

        /* 全局版面 */
        .container { max-width: 1200px; margin: auto; background-color: #0d1117; padding: 15px; border-radius: 12px; border: 1px solid #30363d; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        h2 { font-size: 1.3em; margin: 0; color: #58a6ff; }
        
        /* 頂部設定與儀表板 */
        .top-panel { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; width: 100%; }
        .setup-box { background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #30363d; flex: 1; min-width: 250px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 2; min-width: 100%; }
        .stat-item { background: #161b22; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #30363d; }
        .val { font-size: 1.2em; font-weight: bold; color: #58a6ff; margin-top: 3px; }
        input[type="number"] { background: #010409; color: #c9d1d9; border: 1px solid #30363d; padding: 10px; border-radius: 6px; width: 100px; box-sizing: border-box; }

        /* 三桌網格佈局 (修復跑版核心：minmax 與 min-width: 0) */
        .tables-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; width: 100%; }
        .table-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; min-width: 0; /* 修正格線撐破畫面的關鍵 */ display: flex; flex-direction: column; }
        .table-title { font-size: 1.1em; color: #f0f6fc; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .signal-box { background: #010409; padding: 10px; border-radius: 6px; border: 1px dashed #484f58; min-height: 50px; margin-bottom: 10px; font-size: 0.95em; line-height: 1.4; display: flex; align-items: center; justify-content: center; text-align: center; word-break: break-all; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-B { background: #da3633; box-shadow: 0 4px 0 #8e211f; padding: 15px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 1.1em; }
        .btn-P { background: #1f6feb; box-shadow: 0 4px 0 #1149a1; padding: 15px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 1.1em; }
        .btn-B:active, .btn-P:active { transform: translateY(4px); box-shadow: none; }
        
        /* 牌路序列 (加入寬度限制以啟用 overflow) */
        .road-map { background: #010409; padding: 10px; border-radius: 6px; border: 1px solid #30363d; overflow-x: auto; white-space: nowrap; display: flex; align-items: center; height: 32px; scroll-behavior: smooth; width: 100%; box-sizing: border-box; }
        .dot { display: inline-block; width: 20px; height: 20px; border-radius: 4px; margin: 0 2px; text-align: center; font-size: 11px; line-height: 20px; font-weight: bold; flex-shrink: 0; }
        .dot-B { background: #da3633; color: white;}
        .dot-P { background: #1f6feb; color: white;}
        .badge { background: #30363d; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; color: #c9d1d9; white-space: nowrap; }

        /* 日誌與警報 */
        .log-panel { background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 15px; height: 180px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.9em; line-height: 1.5; scroll-behavior: smooth; word-wrap: break-word; }
        .log-entry { margin-bottom: 6px; border-bottom: 1px dashed #21262d; padding-bottom: 6px; }
        .log-time { color: #8b949e; font-size: 0.85em; margin-right: 8px; }
        #alertPanel { display: none; background: #da363322; border: 1px solid #da3633; color: #ff7b72; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center; animation: blink 1.5s infinite; line-height: 1.4; }
        @keyframes blink { 0% {opacity:1;} 50% {opacity:0.6;} 100% {opacity:1;} }

        /* RWD 手機版介面適配 */
        @media (min-width: 768px) {
            .stat-grid { grid-template-columns: repeat(4, 1fr); min-width: 0; }
        }
        @media (max-width: 767px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            h2 { font-size: 1.1em; }
            .setup-box { display: flex; flex-direction: column; }
            .setup-box input[type="number"] { width: 100%; margin-bottom: 10px; }
            #fundDiv { display: flex; flex-wrap: wrap; gap: 10px; }
            #fundDiv input { flex: 1 1 100%; }
            #fundDiv button { flex: 1; }
            .login-box { padding: 20px; }
            .btn-B, .btn-P { padding: 18px; /* 加大手勢點擊範圍 */ }
        }
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2 style="color:#58a6ff; margin-bottom:20px; border:none;">v15.1 終端系統登入</h2>
        <input type="password" id="authPwd" class="login-input" placeholder="Password" onkeypress="if(event.key==='Enter') verifyLogin()">
        <button class="btn-action" style="width:100%; padding:15px; font-size:1.1em;" onclick="verifyLogin()">解鎖系統</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h2>多桌綜合量化終端 (手機適配版)</h2>
        <div id="modeTag" style="background:#30363d; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; font-weight:bold;">等待初始化...</div>
    </div>

    <div class="top-panel">
        <div class="setup-box" id="setupSection">
            <div id="initDiv">
                <span style="color:#8b949e; font-size:0.9em; display:block; margin-bottom:8px;">初始總資金：</span>
                <input type="number" id="initAmount" value="10000" min="1000" step="1000">
                <button class="btn-action" style="margin-top:5px; width:100%;" onclick="initSystem()">啟動系統</button>
            </div>
            <div id="fundDiv" style="display:none; margin-top:5px;">
                <input type="number" id="fundAmount" value="1000" min="100" step="100">
                <button class="btn-action" onclick="adjustFunds('deposit')">入金</button>
                <button class="btn-action" style="background:#da3633;" onclick="adjustFunds('withdraw')">出金</button>
            </div>
        </div>
        
        <div class="stat-grid">
            <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">全局可用餘額</span><div class="val" id="globalBankroll">0</div></div>
            <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">總對局盈虧</span><div class="val" id="globalPnL">0</div></div>
            <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">注碼 (1U=1%)</span><div class="val" id="baseUnit" style="color:#f0883e;">0</div></div>
            <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">連輸警報</span><div class="val" id="lossStreak" style="color:#f85149;">0</div></div>
        </div>
    </div>

    <div id="alertPanel">⚠️ 系統偵測全局已連續虧損 7 局！強烈建議停止操作，休息冷靜。</div>

    <div class="tables-grid" id="tablesContainer"></div>

    <div style="color: #8b949e; font-size: 0.9em; margin-bottom: 5px;">全局下注日誌 (Audit Trail)：</div>
    <div class="log-panel" id="betLog"></div>
</div>

<script>
    // --- 登入模組 ---
    function verifyLogin() {
        if(document.getElementById('authPwd').value === 'test123') {
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            alert('❌ 密碼錯誤！'); document.getElementById('authPwd').value = '';
        }
    }

    // --- 系統變數 ---
    let BASE_CAPITAL = 0; 
    let globalBankroll = 0;
    let global1U = 0; 
    let consecutiveLosses = 0;
    let isInit = false;

    // 桌檯資料結構
    const tables = [
        { id: 1, name: "桌檯 A", history: [], strat: null, pred: null, seqIdx: 0, seq: [] },
        { id: 2, name: "桌檯 B", history: [], strat: null, pred: null, seqIdx: 0, seq: [] },
        { id: 3, name: "桌檯 C", history: [], strat: null, pred: null, seqIdx: 0, seq: [] }
    ];

    function renderTables() {
        const container = document.getElementById('tablesContainer');
        container.innerHTML = '';
        tables.forEach(t => {
            container.innerHTML += `
                <div class="table-card" id="card-${t.id}">
                    <div class="table-title"><span>${t.name}</span><span id="badge-${t.id}"></span></div>
                    <div id="signal-${t.id}" class="signal-box" style="color:#8b949e;">系統未啟動</div>
                    <div class="controls">
                        <button class="btn-B" onclick="process(${t.id}, 'B')" id="btnB-${t.id}" disabled>莊 (B)</button>
                        <button class="btn-P" onclick="process(${t.id}, 'P')" id="btnP-${t.id}" disabled>閒 (P)</button>
                    </div>
                    <div class="road-map" id="road-${t.id}"></div>
                </div>`;
        });
    }
    renderTables();

    // --- 初始化與資金 ---
    function initSystem() {
        let amt = parseInt(document.getElementById('initAmount').value);
        if(amt < 1000 || isNaN(amt)) return;
        BASE_CAPITAL = amt; globalBankroll = amt; isInit = true;
        recalcUnit();

        document.getElementById('initDiv').style.display = 'none';
        document.getElementById('fundDiv').style.display = 'flex';
        tables.forEach(t => {
            document.getElementById(`btnB-${t.id}`).disabled = false;
            document.getElementById(`btnP-${t.id}`).disabled = false;
            setSignal(t, "等待牌路數據...", "#c9d1d9");
        });
        writeLog(`[系統啟動] 載入資金: ${amt} U，基準配額 (1U) 設定為 ${global1U} U`, '#58a6ff');
        updateGlobalUI();
    }

    function adjustFunds(action) {
        let amt = parseInt(document.getElementById('fundAmount').value);
        if(isNaN(amt) || amt <= 0) return;
        if(action === 'deposit') {
            globalBankroll += amt; BASE_CAPITAL += amt;
            writeLog(`[資金操作] 入金 +${amt} U。`, '#58a6ff');
        } else {
            if(amt > globalBankroll) { alert("餘額不足"); return; }
            globalBankroll -= amt; BASE_CAPITAL -= amt;
            writeLog(`[資金操作] 出金 -${amt} U。`, '#58a6ff');
        }
        recalcUnit(); updateGlobalUI();
    }

    function recalcUnit() {
        global1U = Math.max(1, Math.floor(BASE_CAPITAL * 0.01)); 
    }

    function writeLog(msg, color='') {
        const log = document.getElementById('betLog');
        const time = new Date().toLocaleTimeString('en-GB');
        log.innerHTML += `<div class="log-entry"><span class="log-time">[${time}]</span><span style="color:${color}">${msg}</span></div>`;
        log.scrollTop = log.scrollHeight;
    }

    function setSignal(t, msg, color) {
        const el = document.getElementById(`signal-${t.id}`);
        el.innerHTML = msg; el.style.color = color;
    }

    // --- 核心處理引擎 ---
    function process(tId, res) {
        if(!isInit) return;
        const t = tables.find(x => x.id === tId);
        t.history.push(res);
        writeLog(`[${t.name}] 紀錄：${res === 'B'?'莊':'閒'}`, '#8b949e');

        // 1. 結算
        if (t.strat) {
            let betAmt = t.seq[t.seqIdx] * global1U;
            if (res === t.pred) {
                globalBankroll += betAmt;
                t.seqIdx++;
                consecutiveLosses = 0;
                writeLog(`[${t.name}] 預測成功 (+${betAmt} U)`, '#3fb950');
                
                if (t.seqIdx >= t.seq.length) {
                    setSignal(t, "💰 循環達標！等待新訊號", "#3fb950");
                    clearStrat(t);
                } else {
                    updatePred(t, res);
                    let nextAmt = t.seq[t.seqIdx] * global1U;
                    setSignal(t, `✅ 連勝推第 ${t.seqIdx+1} 注<br>下注 [${t.pred==='B'?'莊':'閒'}] : ${nextAmt} U`, "#3fb950");
                }
            } else {
                globalBankroll -= betAmt;
                consecutiveLosses++;
                writeLog(`[${t.name}] 預測失敗 (-${betAmt} U)`, '#f85149');
                setSignal(t, "❌ 策略斷裂，重新掃描", "#8b949e");
                clearStrat(t);
            }
        }

        document.getElementById('alertPanel').style.display = consecutiveLosses >= 7 ? 'block' : 'none';

        // 2. 掃描
        if (!t.strat) scanLogic(t);

        // 3. UI與捲動更新
        updateGlobalUI();
        const road = document.getElementById(`road-${t.id}`);
        road.innerHTML = t.history.map(x => `<div class="dot dot-${x}">${x}</div>`).join('');
        road.scrollLeft = road.scrollWidth;
    }

    // --- 無衝突策略邏輯 ---
    function scanLogic(t) {
        let h = t.history;
        let len = h.length;
        if(len < 3) return;

        let last4 = len >= 4 ? h.slice(-4).join('') : '';
        let last3 = h.slice(-3).join('');

        // 優先級1: 長龍
        let isDragon = len >= 4 && (last4 === 'BBBB' || last4 === 'PPPP');
        if (isDragon) { trigger(t, '長龍跟隨', h[len-1]); return; }

        // 優先級2: 連三反跳
        let isThree = (last3 === 'BBB' || last3 === 'PPP');
        let notInsideDragon = len < 4 || h[len-4] !== h[len-1]; 
        if (isThree && notInsideDragon) { trigger(t, '連三反跳', h[len-1] === 'B' ? 'P' : 'B'); return; }

        if(len < 4) return;

        // 優先級3: 單跳
        if (last4 === 'BPBP' || last4 === 'PBPB') { trigger(t, '單跳系統', h[len-1] === 'B' ? 'P' : 'B'); return; }

        // 優先級4: 雙跳
        if (last4 === 'BBPP' || last4 === 'PPBB') { trigger(t, '雙跳規律', h[len-1] === 'B' ? 'P' : 'B'); return; }
    }

    function trigger(t, name, target) {
        t.strat = name; t.pred = target; t.seqIdx = 0;
        let isAggressive = globalBankroll >= BASE_CAPITAL * 1.8;
        t.seq = isAggressive ? [2, 5, 4, 8] : [1, 3, 2, 4];
        
        let amt = t.seq[0] * global1U;
        document.getElementById(`badge-${t.id}`).innerHTML = `<span class="badge">${name}</span>`;
        setSignal(t, `⚠️ 訊號觸發！<br>下注 [${t.pred==='B'?'莊':'閒'}] : ${amt} U`, "#f0883e");
        writeLog(`[${t.name}] 啟動 ${name} (${isAggressive?'激進':'防禦'}模式)。首注 ${amt} U`, '#f0883e');
    }

    function updatePred(t, lastRes) {
        if(t.strat === '長龍跟隨') t.pred = lastRes;
        else if(t.strat === '單跳系統' || t.strat === '連三反跳') t.pred = (lastRes === 'B' ? 'P' : 'B');
        else if(t.strat === '雙跳規律') {
            let last2 = t.history.slice(-2);
            t.pred = (last2[0] === last2[1]) ? (last2[1] === 'B' ? 'P' : 'B') : last2[1];
        }
    }

    function clearStrat(t) {
        t.strat = null; t.pred = null; t.seqIdx = 0;
        document.getElementById(`badge-${t.id}`).innerHTML = '';
    }

    function updateGlobalUI() {
        document.getElementById('globalBankroll').innerText = globalBankroll;
        document.getElementById('baseUnit').innerText = global1U;
        document.getElementById('lossStreak').innerText = consecutiveLosses;
        
        let pnl = globalBankroll - BASE_CAPITAL;
        let pnlEl = document.getElementById('globalPnL');
        pnlEl.innerText = (pnl > 0 ? '+' : '') + pnl;
        pnlEl.style.color = pnl > 0 ? '#3fb950' : (pnl < 0 ? '#f85149' : '#58a6ff');

        const modeTag = document.getElementById('modeTag');
        if(!isInit) return;
        if (globalBankroll >= BASE_CAPITAL * 1.8) {
            modeTag.innerText = "🔥 激進模式 (2-5-4-8)"; modeTag.style.background = "#da3633";
        } else {
            modeTag.innerText = "🛡️ 保守防禦 (1-3-2-4)"; modeTag.style.background = "#238636";
        }
    }
</script>

</body>
</html>
