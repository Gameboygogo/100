<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業量化終端機 v14.1 - 登入驗證版</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; margin: 0; }
        
        /* --- 登入彈窗遮罩樣式 --- */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 9, 0.9); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; /* 確保在最上層 */
        }
        .login-box {
            background: #161b22; padding: 40px; border-radius: 12px;
            border: 1px solid #30363d; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center; width: 300px;
        }
        .login-title { color: #58a6ff; font-size: 1.5em; margin-bottom: 20px; font-weight: bold; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
            font-size: 1.1em; box-sizing: border-box; text-align: center; letter-spacing: 2px;
        }
        .btn-login {
            width: 100%; background: #238636; color: white; border: none;
            padding: 12px; border-radius: 6px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-login:hover { background: #2ea043; }
        
        /* --- 儀表板樣式 --- */
        .container { max-width: 950px; margin: auto; background-color: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 15px; margin-bottom: 20px; }
        
        .setup-panel { background: #21262d; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; border: 1px solid #30363d;}
        input[type="number"] { background: #010409; color: #c9d1d9; border: 1px solid #30363d; padding: 10px; border-radius: 6px; font-size: 1em; width: 150px; }
        .btn-action { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-action:hover { background: #2ea043; }
        .btn-withdraw { background: #da3633; }
        .btn-withdraw:hover { background: #f85149; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-item { background: #21262d; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #30363d; }
        .val { font-size: 1.3em; font-weight: bold; color: #58a6ff; margin-top: 5px; }

        .signal-box { background: #010409; padding: 15px; border-radius: 8px; border-left: 5px solid #f0883e; margin-bottom: 20px; font-size: 1.1em; height: 30px;}
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .btn-B { background: #da3633; box-shadow: 0 4px 0 #8e211f; padding: 15px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-P { background: #1f6feb; box-shadow: 0 4px 0 #1149a1; padding: 15px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 8px; color: white; font-weight: bold; }
        .btn-B:active, .btn-P:active { transform: translateY(4px); box-shadow: none; }
        
        .road-map { background: #010409; padding: 15px; border-radius: 8px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; border: 1px solid #30363d; display: flex; align-items: center; min-height: 24px; scroll-behavior: smooth;}
        .dot { display: inline-block; width: 22px; height: 22px; border-radius: 4px; margin: 0 2px; text-align: center; font-size: 12px; line-height: 22px; font-weight: bold;}
        .dot-B { background: #da3633; color: white;}
        .dot-P { background: #1f6feb; color: white;}

        .log-panel { background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 15px; height: 200px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.9em; line-height: 1.5; scroll-behavior: smooth;}
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #30363d; padding-bottom: 5px; }
        .log-time { color: #8b949e; font-size: 0.85em; margin-right: 10px; }
        .log-win { color: #3fb950; }
        .log-loss { color: #f85149; }
        .log-sys { color: #58a6ff; }
        
        #alertPanel { display: none; background: #da363322; border: 1px solid #da3633; color: #ff7b72; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; text-align: center;}
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div class="login-title">🔐 終端系統登入</div>
        <input type="password" id="authPwd" class="login-input" placeholder="請輸入授權密碼" onkeypress="handleEnter(event)">
        <button class="btn-login" onclick="verifyLogin()">登入系統</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: #58a6ff;">量化交易終端 v14.1</h2>
        <div id="modeTag" style="background:#238636; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; font-weight:bold;">等待初始化</div>
    </div>

    <div class="setup-panel" id="setupPanel">
        <span style="font-weight: bold; color: #c9d1d9;">設定初始資金：</span>
        <input type="number" id="initAmount" value="10000" min="1000" step="1000">
        <button class="btn-action" onclick="initializeSystem()">啟動系統</button>
    </div>

    <div class="setup-panel" id="fundPanel" style="display: none; justify-content: space-between;">
        <div>
            <span style="font-weight: bold; color: #c9d1d9;">動態出入金：</span>
            <input type="number" id="fundAmount" value="1000" min="100" step="100">
            <button class="btn-action" onclick="adjustFunds('deposit')">⬇️ 入金</button>
            <button class="btn-withdraw" onclick="adjustFunds('withdraw')">⬆️ 出金</button>
        </div>
        <div style="font-size: 0.9em; color: #8b949e;">激進目標(180%): <span id="targetBankroll">0</span> U</div>
    </div>

    <div id="alertPanel">⚠️ 系統警報：當前已連續虧損 7 局！請強制休息 15 分鐘。</div>

    <div class="stat-grid">
        <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">可用虛擬餘額</span><div class="val" id="bankroll">0</div></div>
        <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">總對局盈虧</span><div class="val" id="sessionPnL">0</div></div>
        <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">基準注碼(1U)</span><div class="val" id="baseUnit">100</div></div>
        <div class="stat-item"><span style="font-size:0.8em; color:#8b949e;">當前連輸</span><div class="val" id="lossStreak" style="color:#f85149;">0</div></div>
    </div>

    <div id="signalPanel" class="signal-box">系統未啟動。請先設定初始資金。</div>

    <div class="controls">
        <button class="btn-B" onclick="process('B')" id="btnB" disabled>輸入：莊贏 (Banker)</button>
        <button class="btn-P" onclick="process('P')" id="btnP" disabled>輸入：閒贏 (Player)</button>
    </div>

    <div style="color: #8b949e; font-size: 0.9em; margin-bottom: 5px;">牌路序列 (自動滾動)：</div>
    <div class="road-map" id="beadPlate"></div>

    <div style="color: #8b949e; font-size: 0.9em; margin-bottom: 5px;">訊號與下注日誌 (Audit Trail)：</div>
    <div class="log-panel" id="betLog"></div>
</div>

<script>
    // --- 登入驗證模組 ---
    function verifyLogin() {
        const pwdInput = document.getElementById('authPwd');
        if (pwdInput.value === 'test123') {
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            alert('❌ 密碼錯誤，請重新輸入！');
            pwdInput.value = '';
            pwdInput.focus();
        }
    }

    // 支援 Enter 鍵登入
    function handleEnter(event) {
        if (event.key === 'Enter') {
            verifyLogin();
        }
    }

    // --- 核心系統模組 ---
    let BASE_CAPITAL = 0; 
    let bankroll = 0;
    const BASE_UNIT = 100;
    let historyData = [];
    let consecutiveLosses = 0;
    let gameCount = 0;
    
    let activeStrat = null;
    let prediction = null;
    let seqIndex = 0;
    let currentSeq = [1, 3, 2, 4];
    let isInitialized = false;

    function initializeSystem() {
        let amt = parseInt(document.getElementById('initAmount').value);
        if (amt < 1000 || isNaN(amt)) { alert("請輸入有效的初始資金 (最低 1000)"); return; }
        
        BASE_CAPITAL = amt;
        bankroll = amt;
        isInitialized = true;

        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('fundPanel').style.display = 'flex';
        document.getElementById('btnB').disabled = false;
        document.getElementById('btnP').disabled = false;

        writeLog(`[系統啟動] 載入初始資金: ${amt} U`, 'log-sys');
        showSignal("系統已啟動，等待牌路數據輸入...", "#c9d1d9");
        updateUI();
    }

    function adjustFunds(type) {
        let amt = parseInt(document.getElementById('fundAmount').value);
        if (amt <= 0 || isNaN(amt)) return;

        if (type === 'deposit') {
            bankroll += amt;
            BASE_CAPITAL += amt; 
            writeLog(`[資金操作] 成功入金: +${amt} U (新基準: ${BASE_CAPITAL})`, 'log-sys');
        } else if (type === 'withdraw') {
            if (amt > bankroll) { alert("餘額不足，無法出金"); return; }
            bankroll -= amt;
            BASE_CAPITAL -= amt; 
            writeLog(`[資金操作] 成功出金: -${amt} U (新基準: ${BASE_CAPITAL})`, 'log-sys');
        }
        updateUI();
    }

    function writeLog(message, cssClass = '') {
        const logBox = document.getElementById('betLog');
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="${cssClass}">${message}</span>`;
        logBox.appendChild(entry);
        
        logBox.scrollTop = logBox.scrollHeight;
    }

    function process(result) {
        if (!isInitialized) return;
        gameCount++;
        historyData.push(result);
        writeLog(`[第 ${gameCount} 局] 開出結果：${result === 'B' ? '莊' : '閒'}`, '');

        if (activeStrat) {
            let betAmt = currentSeq[seqIndex] * BASE_UNIT;
            let targetStr = prediction === 'B' ? '莊' : '閒';
            
            if (result === prediction) {
                bankroll += betAmt;
                seqIndex++;
                consecutiveLosses = 0;
                writeLog(`[結算] 預測 (${targetStr}) 成功。獲利 +${betAmt} U`, 'log-win');
                
                if (seqIndex >= currentSeq.length) {
                    showSignal("💰 循環完成！等待新訊號。", "#3fb950");
                    writeLog(`[策略完成] ${activeStrat} 循環達標，獲利鎖定。`, 'log-win');
                    activeStrat = null; seqIndex = 0;
                } else {
                    updatePred(result);
                    let nextAmt = currentSeq[seqIndex] * BASE_UNIT;
                    showSignal(`✅ 獲勝！請下注 [${prediction==='B'?'莊':'閒'}] : ${nextAmt} U`, "#3fb950");
                    writeLog(`[下注指示] 第 ${seqIndex+1} 注，方向: ${prediction==='B'?'莊':'閒'}，金額: ${nextAmt} U`, '');
                }
            } else {
                bankroll -= betAmt;
                consecutiveLosses++;
                writeLog(`[結算] 預測 (${targetStr}) 失敗。虧損 -${betAmt} U`, 'log-loss');
                showSignal(`❌ 訊號中斷。策略認損。`, "#8b949e");
                activeStrat = null; seqIndex = 0;
            }
        }

        document.getElementById('alertPanel').style.display = (consecutiveLosses >= 7) ? 'block' : 'none';
        if(consecutiveLosses === 7) writeLog(`[系統警告] 觸發連輸 7 局閥值，建議停止操作。`, 'log-loss');

        if (!activeStrat) scan();

        updateUI();
        
        const beadPlate = document.getElementById('beadPlate');
        beadPlate.scrollLeft = beadPlate.scrollWidth;
    }

    function scan() {
        if (historyData.length < 3) return;
        const last3 = historyData.slice(-3).join('');
        
        if (last3 === 'BBB' || last3 === 'PPP') {
            activeStrat = '連三反跳';
            prediction = last3[0] === 'B' ? 'P' : 'B';
            
            let isAggressive = bankroll >= BASE_CAPITAL * 1.8;
            currentSeq = isAggressive ? [2, 5, 4, 8] : [1, 3, 2, 4];
            let betAmt = currentSeq[0] * BASE_UNIT;
            
            showSignal(`⚠️ 觸發反跳！請下注 [${prediction==='B'?'莊':'閒'}] : ${betAmt} U`, "#f0883e");
            writeLog(`[策略觸發] 偵測連三，啟動反跳。模式: ${isAggressive?'激進(2-5-4-8)':'防禦(1-3-2-4)'}`, 'log-sys');
            writeLog(`[下注指示] 第 1 注，方向: ${prediction==='B'?'莊':'閒'}，金額: ${betAmt} U`, '');
        }
    }

    function updatePred(last) {
        if (activeStrat === '連三反跳') prediction = (last === 'B' ? 'P' : 'B');
    }

    function showSignal(msg, color) {
        const el = document.getElementById('signalPanel');
        el.innerHTML = msg; el.style.color = color;
    }

    function updateUI() {
        document.getElementById('bankroll').innerText = bankroll;
        document.getElementById('targetBankroll').innerText = BASE_CAPITAL * 1.8;
        let pnl = bankroll - BASE_CAPITAL;
        let pnlEl = document.getElementById('sessionPnL');
        pnlEl.innerText = (pnl > 0 ? '+' : '') + pnl;
        pnlEl.style.color = pnl > 0 ? '#3fb950' : (pnl < 0 ? '#f85149' : '#c9d1d9');
        document.getElementById('lossStreak').innerText = consecutiveLosses;
        
        const modeTag = document.getElementById('modeTag');
        if (bankroll >= BASE_CAPITAL * 1.8 && isInitialized) {
            modeTag.innerText = "🔥 激進模式 (2-5-4-8)";
            modeTag.style.background = "#da3633";
        } else {
            modeTag.innerText = "🛡️ 保守模式 (1-3-2-4)";
            modeTag.style.background = "#238636";
        }

        document.getElementById('beadPlate').innerHTML = historyData.map(r => `<div class="dot dot-${r}">${r}</div>`).join('');
    }
</script>

</body>
</html>
